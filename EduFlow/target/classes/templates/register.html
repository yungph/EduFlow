<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | EduFlow Academy</title>
<!--  <link rel="stylesheet" href="/static/css/styles.css">-->
  <link rel="stylesheet" th:href="@{/css/styles.css}">
<!--  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">-->
  <link rel="stylesheet" th:href="@{https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css}">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>

</head>
<body>
<div class="container">
  <div class="logo-container">
    <i class="fas fa-graduation-cap logo-icon"></i>
    <h1>EduFlow Academy</h1>
    <p class="tagline">Unlock your potential through quality education</p>
  </div>

  <form id="registrationForm" class="registration-form" method="POST" action="/register">
    <h2>Create Your Account</h2>

    <div class="form-group">
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" name="fullName" required>
      <i class="fas fa-user input-icon"></i>
    </div>

    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required>
      <i class="fas fa-envelope input-icon"></i>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>
      <i class="fas fa-lock input-icon"></i>
      <div class="password-strength">
        <span class="strength-bar"></span>
        <span class="strength-bar"></span>
        <span class="strength-bar"></span>
      </div>
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword" name="confirmPassword" required>
      <i class="fas fa-lock input-icon"></i>
    </div>


    <div class="form-group">
      <label for="accountType">Account Type</label>
      <input type="text" id="accountType" name="accountType" placeholder="Enter 'student' or 'instructor'" required>
      <div class="error-message"></div>
    </div>


    <!--    <div class="form-group">-->
<!--      <label for="courseInterest">Primary Course Interest</label>-->
<!--      <select id="courseInterest" name="courseInterest" required>-->
<!--        <option value="">Select an option</option>-->
<!--        <option value="cs">Computer Science</option>-->
<!--        <option value="business">Business Administration</option>-->
<!--        <option value="design">Graphic Design</option>-->
<!--        <option value="health">Health Sciences</option>-->
<!--        <option value="engineering">Engineering</option>-->
<!--      </select>-->
<!--      <i class="fas fa-book input-icon"></i>-->
<!--    </div>-->

    <div class="form-group checkbox-group">
      <input type="checkbox" id="terms" name="terms" required>
      <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
    </div>

    <button type="submit" class="submit-btn">Register Now</button>

    <div class="login-link">
      Already have an account? <a href="/new-login">Log in</a>
    </div>
  </form>
</div>

<script src="/js/script-register.js"></script>

</body>
</html>
